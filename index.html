<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Атлас</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%);
            color: #d4d4d4; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        #chat-container { width: 900px; display: flex; flex-direction: column; height: 100vh; }
        #header {
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #7ab8ff; font-weight: bold; letter-spacing: 1px;
        }
        #header .buttons button {
            background: rgba(122,184,255,0.1); color: #7ab8ff;
            border: 1px solid rgba(122,184,255,0.3);
            padding: 6px 14px; border-radius: 8px;
            cursor: pointer; font-size: 12px; margin-left: 8px;
            transition: all 0.2s;
        }
        #header .buttons button:hover { background: rgba(122,184,255,0.25); }
        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .message {
            padding: 14px 18px; border-radius: 12px;
            max-width: 80%; line-height: 1.6;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .message.user {
            background: linear-gradient(135deg, #0e639c, #1177bb);
            color: white; align-self: flex-end;
            border-bottom-right-radius: 2px;
            white-space: pre-wrap;
        }
        .message.ai {
            background: rgba(40,40,45,0.9);
            color: #e0e0e0; align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #7ab8ff;
        }
        .message.ai p { margin: 8px 0; }
        .message.ai h1, .message.ai h2, .message.ai h3 { color: #7ab8ff; margin: 10px 0 6px; }
        .message.ai ul, .message.ai ol { padding-left: 22px; margin: 6px 0; }
        .message.ai li { margin: 4px 0; }
        .message.ai code {
            background: rgba(0,0,0,0.4); padding: 2px 6px;
            border-radius: 4px; font-family: 'Consolas', monospace;
            color: #ce9178; font-size: 13px;
        }
        .message.ai pre {
            background: rgba(0,0,0,0.5); padding: 12px;
            border-radius: 8px; overflow-x: auto; margin: 10px 0;
            border-left: 3px solid #7ab8ff;
        }
        .message.ai pre code {
            background: transparent; padding: 0;
            color: inherit; font-size: 13px;
        }
        .message.ai table {
            border-collapse: collapse; margin: 10px 0; width: 100%;
            font-size: 13px;
        }
        .message.ai th, .message.ai td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 10px; text-align: left;
        }
        .message.ai th { background: rgba(122,184,255,0.15); }
        #input-area {
            display: flex; padding: 14px 16px;
            margin: 0 -3mm 8px -3mm;
            width: calc(100% + 6mm);
            background: rgba(37,37,38,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(122,184,255,0.15);
            border-radius: 16px; gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative; z-index: 10;
        }
        #input-area:hover {
            transform: translateY(-37%) scale(1.01);
            box-shadow: 0 20px 40px rgba(122,184,255,0.25);
        }
        input {
            flex: 1; padding: 12px 14px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(20,20,25,0.6); color: white;
            outline: none; font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #7ab8ff; }
        button#send {
            padding: 12px 22px;
            background: linear-gradient(135deg, #0e639c, #1177bb);
            color: white; border: none; border-radius: 10px;
            cursor: pointer; font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button#send:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(122,184,255,0.4); }
        button#send:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <span>◈ АТЛАС v3.0 ◈</span>
            <div class="buttons">
                <button onclick="clearChat()">Очистить чат</button>
                <button onclick="clearMemory()">Очистить память</button>
            </div>
        </div>
        <div id="messages">
            <div class="message ai">Привет, Игорь! Я Атлас. Теперь я умею красиво форматировать ответы: <strong>жирный</strong>, <em>курсив</em>, <code>код</code>, списки и таблицы. Чем займёмся?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Напиши Атласу..." autocomplete="off">
            <button id="send" onclick="sendMessage()">Отправить</button>
        </div>
    </div>
    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send');

        // Настройка Markdown
        marked.setOptions({
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = '...';
            try {
                const r = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await r.json();
                addMessage(data.reply, 'ai');
            } catch (e) {
                addMessage('Ошибка соединения с сервером.', 'ai');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
                userInput.focus();
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'ai') {
                div.innerHTML = marked.parse(text);
                div.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            } else {
                div.textContent = text;
            }
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearChat() {
            if (confirm('Очистить визуальный чат? (Память сохранится)')) {
                messagesDiv.innerHTML = '<div class="message ai">Чат очищен. Чем займёмся?</div>';
            }
        }

        async function clearMemory() {
            if (confirm('Полностью очистить память Атласа? Он забудет весь прошлый диалог.')) {
                try {
                    await fetch('/clear-memory', { method: 'POST' });
                    messagesDiv.innerHTML = '<div class="message ai">Память очищена. Начинаем с чистого листа.</div>';
                } catch (e) {
                    alert('Ошибка очистки памяти');
                }
            }
        }

        userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
